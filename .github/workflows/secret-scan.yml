name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the commits in this push / pull request (not the whole history, so an already
      # resolved alert in an old commit doesn't fail every build) plus the current files.
      - name: Run gitleaks
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.28.0
          docker pull -q "$image"
          range=""
          if [ -n "${BASE:-}" ]; then
            range="$BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            docker run --rm -v "$PWD:/repo" -w /repo "$image" \
              git --redact --no-banner --config /repo/.gitleaks.toml --log-opts="$range" .
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir --redact --no-banner --config /repo/.gitleaks.toml .
