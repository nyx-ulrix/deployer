name: Release

on:
  push:
    tags: ["v*"]

# Only the repository's own GITHUB_TOKEN is used - no personal secrets.
permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deployer-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # v1.2.3 -> 1.2.3 (matches DEPLOYER_VERSION written by the installer) and latest.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=deployer-${{ matrix.component }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  bundle:
    name: Deploy bundle + GitHub release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4

      - name: Build deployer-deploy.zip
        run: |
          mkdir -p dist
          zip -r dist/deployer-deploy.zip deploy installer -x 'deploy/.env'
          (cd dist && sha256sum deployer-deploy.zip > deployer-deploy.zip.sha256)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deployer-deploy.zip
            dist/deployer-deploy.zip.sha256
          generate_release_notes: true
          body: |
            ## Install on Windows

            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/installer/install.ps1))) -Repo ${{ github.repository }} -Ref ${{ github.ref_name }}
            ```

            Images: `ghcr.io/${{ github.repository_owner }}/deployer-api` and `deployer-dashboard`, tagged with this version (without the leading `v`) and `latest`.
            Existing installs: `deployer update -Ref ${{ github.ref_name }}`.
